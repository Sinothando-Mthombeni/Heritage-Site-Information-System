services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: heritage_phase2_test
      POSTGRES_USER: heritage_test
      POSTGRES_PASSWORD: heritage_test_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage_test -d heritage_phase2_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:6
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
