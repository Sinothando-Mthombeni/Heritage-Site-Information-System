name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: heritage_phase2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:6
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: test_settings
      HERITAGE_TEST_DB_NAME: heritage_phase2_test
      HERITAGE_TEST_DB_USER: postgres
      HERITAGE_TEST_DB_PASSWORD: postgres
      HERITAGE_TEST_DB_HOST: 127.0.0.1
      HERITAGE_TEST_DB_PORT: 5432
      HERITAGE_TEST_MONGO_URI: mongodb://127.0.0.1:27018/
      HERITAGE_TEST_MONGO_DB_NAME: heritage_phase2_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run system check
        working-directory: backend
        run: python manage.py check
      
      - name: Verify installed packages
        working-directory: backend
        run: pip show django-cors-headers django-ratelimit sentry-sdk

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate
      
      - name: Collect static files
        working-directory: backend
        run: python manage.py collectstatic --noinput

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v